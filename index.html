    <!-- Anti-FOUC Theme Initializer -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('portfolio-theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
